# The Fatty Liver Diet Cookbook for Type 2 Diabetes — machine-readable spec (single source of truth).
# schema_version 1. Values distilled from docs/fatty_liver_diabetes_guidelines.md.
# Every quantitative claim references a `sources:` id resolved in the `sources:` block.
#
# Loader-parsed sections (drive runtime): per_recipe_constraints.meal_categories + hard_blocks,
#   recipe_categories, prompt_snippets.{ideation,drafting,critic}, cooking_methods.prefer/avoid.
# Per-serving values are DERIVED (a daily authority target split across the day's eating occasions)
#   and flagged severity: soft unless a structural hard_block. Servings fixed at 2; per-serving =
#   one person's per-meal portion.
#
# THREE PLACES CARRY THE SAME NUMBERS BY DESIGN: meal_categories below, the prose in
#   prompt_snippets.drafting, and the table in section 4 of the dossier. Change all three together;
#   tests/test_spec_coherence.py and tests/test_dossier_coherence.py assert they agree.

meta:
  schema_version: 1
  title: Fatty liver (MASLD) + type 2 diabetes cookbook — recipe guidelines
  book: "The Fatty Liver Diet Cookbook for Type 2 Diabetes"
  subtitle: "100+ Recipes in Under 30 Minutes from Everyday Ingredients, with a Personalized 30-Day Meal Plan to Help Lower Liver Fat and Keep Your Blood Sugar Steady"
  description: >-
    US adults with type 2 diabetes who have been told they have fatty liver — clinically
    metabolic dysfunction-associated steatotic liver disease (MASLD), or its inflammatory form
    MASH. Typically overweight or living with obesity, often on metformin and frequently on a
    GLP-1 receptor agonist, SGLT2 inhibitor, insulin or a sulfonylurea. One way of eating for
    both conditions: Mediterranean-pattern, energy-controlled, very low in added sugar,
    fiber- and protein-forward, alcohol-free, deliberately NOT low-carbohydrate. Every recipe
    on the table in under 30 minutes from mainstream US-supermarket ingredients.
    English; USDA FoodData Central nutrition.
  companion_doc: "docs/fatty_liver_diabetes_guidelines.md"
  fixed_servings: 2
  last_reviewed: "2026-08-09"
  review_notes: >-
    Grounded in EASL-EASD-EASO 2024, AASLD 2023, the AGA 2021 lifestyle Clinical Practice Update,
    the ADA MASLD consensus report 2025, ADA Standards of Care 2026 (§4 and §5), the Dietary
    Guidelines for Americans 2025-2030 (published 2026-01-07), FDA labeling rules and AHA figures,
    plus named RCTs and meta-analyses. FETCH FAILURES TO RE-VERIFY BEFORE PRINT (full detail in
    section 9 of the dossier): diabetesjournals.org returned HTTP 403 for both the ADA MASLD
    consensus report and ADA Standards of Care 2026 §4/§5, so their figures come from official
    abstracts and society-derived summaries, each corroborated by a second retrieved source;
    dietaryguidelines.gov failed to fetch and realfood.gov served an image-only PDF, so the
    DGA 2025-2030 figures come from a guideline-summary service and the Harvard Nutrition Source
    — the "no more than 10 g of added sugars per meal" figure is load-bearing for this spec and
    MUST be re-verified against the primary document. The percentage liver-fat reductions in
    Markova 2017 and the "39%" steatosis figure circulating for a 12-week Mediterranean trial
    could NOT be retrieved and MUST NOT be printed. USDA FDC nutrient ids 1235/1092/1114 were
    verified against the live nutrient.csv on 2026-07-19 (carried from the parent engine).
    'Net carbs' is deliberately NOT computed or printed in this book — ADA and FDA both count
    total carbohydrate, and a reader dosing insulin must not be shown a subtracted number.

sources:
  - id: easl-easd-easo-2024
    name: "EASL-EASD-EASO. Clinical Practice Guidelines on the management of metabolic dysfunction-associated steatotic liver disease (MASLD), 2024 — Executive Summary. (Weight loss >=5% to reduce liver fat, 7-10% to improve liver inflammation, >=10% to improve fibrosis — LoE 2, strong. Improve diet quality similar to the Mediterranean dietary pattern; limit ultra-processed food rich in sugars and saturated fat; avoid sugar-sweetened beverages — LoE 2, strong. >150 min/week moderate or 75 min/week vigorous physical activity — LoE 1, strong. All alcohol stopped completely and permanently in advanced fibrosis or cirrhosis. Cirrhosis: >=35 kcal/kg/day and 1.2-1.5 g/kg/day protein.)"
    url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC11519095/"
    accessed: "2026-08-09"
  - id: aasld-2023
    name: "Rinella ME, Neuschwander-Tetri BA, Siddiqui MS, et al. AASLD Practice Guidance on the clinical assessment and management of nonalcoholic fatty liver disease. Hepatology 2023;77:1797-1835. (Weight loss 3-5% improves steatosis; >10% generally required to improve NASH and fibrosis. Excessive fructose consumption increases the risk of NAFLD, NASH and advanced fibrosis independent of calorie intake. Alcohol categories: mild up to 20 g/day women and 30 g/day men; moderate use increases the probability of advanced fibrosis; heavy use should be avoided. Coffee 3+ cups/day could be recommended absent contraindications. >=150 min/week moderate exercise. Vitamin E 800 IU/day only in NON-DIABETIC non-cirrhotic patients. Pioglitazone 30-45 mg/day.)"
    url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC10735173/"
    accessed: "2026-08-09"
  - id: aga-2021-lifestyle
    name: "Younossi ZM, et al. AGA Clinical Practice Update on Lifestyle Modification Using Diet and Exercise to Achieve Weight Loss in the Management of NAFLD: Expert Review. Gastroenterology 2021. (Weight loss >=5% decreases hepatic steatosis, >=7% leads to steatohepatitis resolution, >=10% results in fibrosis regression or stability; lean patients 3-5%. Hypocaloric diet targeting 1,200-1,500 kcal/day or a reduction of 500-1,000 kcal/day from baseline. Follow the Mediterranean diet. Minimize saturated fatty acid intake, specifically red and processed meat. Limit or eliminate consumption of commercially produced fructose. Alcohol consumption should be restricted or eliminated. 150-300 min/week moderate or 75-150 min/week vigorous aerobic exercise plus resistance training.)"
    url: "https://gastro.org/clinical-guidance/lifestyle-modification-using-diet-and-exercise-to-achieve-weight-loss-in-the-management-of-nonalcoholic-fatty-liver-disease-nafld/"
    accessed: "2026-08-09"
  - id: ada-masld-consensus-2025
    name: "Cusi K, Abdelmalek MF, Apovian CM, et al. Metabolic Dysfunction-Associated Steatotic Liver Disease (MASLD) in People With Diabetes: The Need for Screening and Early Intervention. A Consensus Report of the American Diabetes Association. Diabetes Care 2025;48(7):1057-1082. (MASLD affects about 70% of US adults with type 2 diabetes, about half of whom have MASH. Mediterranean eating pattern recommended. Weight-loss targets >=5% to reduce liver fat, >=7-10% to improve inflammation, >=10% to reduce fibrosis. GLP-1 RA, dual GIP/GLP-1 RA, pioglitazone or combinations by liver-disease stage.) NOTE: article page and PDF returned HTTP 403 to the automated fetcher; figures from the official abstract and society summaries, each corroborated by a second retrieved source."
    url: "https://diabetesjournals.org/care/article/48/7/1057/160536/"
    accessed: "2026-08-09"
  - id: ada-soc-2026-s4
    name: "American Diabetes Association. 4. Comprehensive Medical Evaluation and Assessment of Comorbidities: Standards of Care in Diabetes-2026. Diabetes Care 2026;49(Suppl 1). (Screen all adults with type 2 diabetes or prediabetes for liver fibrosis regardless of liver enzyme levels, initial test FIB-4; FIB-4 >=1.3 -> transient elastography or ELF; refer indeterminate/high risk to hepatology. Lifestyle change promoting weight loss; a GLP-1 RA with demonstrated MASH benefit preferred for glycemic management in biopsy-proven MASH or high fibrosis risk.) NOTE: publisher page returned HTTP 403; content from PubMed record and ADA-derived summaries."
